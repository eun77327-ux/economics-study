<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214e42"><title>지환의 경제학 서재</title>
<style>
:root{--bg:#f6f5f0;--paper:#fff;--ink:#223830;--muted:#707b73;--line:#dfe4dc;--brand:#275b48;--soft:#eaf0e7;--gold:#ae753c;--bad:#a83e36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 15px;min-height:44px}button:hover{border-color:var(--brand);background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #bc8d4f;outline-offset:3px}button.primary{background:var(--brand);color:white;border-color:var(--brand)}button:disabled{cursor:default;opacity:.65}input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:11px 13px;max-width:100%}textarea{width:100%;resize:vertical;min-height:140px;line-height:1.8}h1,h2,h3,p{margin-top:0}h1{font-size:38px;letter-spacing:-1.5px;line-height:1.35}h2{font-size:23px;letter-spacing:-.6px}h3{font-size:18px;letter-spacing:-.4px}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{padding:34px 22px;border-right:1px solid var(--line);background:#fcfcf8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font:700 25px Georgia,serif;letter-spacing:-1px}.brand span{color:var(--gold)}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}.nav{display:grid;gap:7px;margin-top:45px}.nav button{text-align:left;background:transparent;border-color:transparent;padding:12px 15px}.nav button.active{background:var(--brand);color:#fff}.nav button b{display:inline-block;width:28px;font-weight:400}.sidebottom{margin-top:auto;font-size:12px;color:var(--muted);padding-top:30px}.sidebottom a{color:inherit}.main{max-width:1280px;width:100%;margin:auto;padding:30px 50px 70px}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px}.topline span{font-size:13px}.hero{display:grid;grid-template-columns:1fr 210px;gap:30px;align-items:center;padding:6px 0 25px}.hero p{color:var(--muted);margin-bottom:13px}.hero .eyebrow{color:var(--gold);margin-bottom:14px}.hero-art{background:var(--soft);border-radius:50%;width:185px;height:185px;display:flex;align-items:center;justify-content:center;position:relative}.hero-art:before{content:"";width:78px;height:105px;border:1px solid #839d81;background:#f9faf3;transform:rotate(-12deg);box-shadow:12px 10px 0 #b5c7ad}.hero-art:after{content:"∂u / ∂x";position:absolute;font:italic 25px Georgia;color:var(--brand);transform:rotate(-12deg)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}.stat strong{font-size:27px;display:block;font-weight:600}.stat small{font-size:12px}.sectionhead,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionhead{margin:25px 0 17px}.sectionhead h2{margin:0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.toolbar input{flex:1;min-width:180px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:23px}.chips button{padding:6px 14px;min-height:36px;border-radius:30px;font-size:13px;background:transparent}.chips .active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:13px;background:var(--paper);overflow:hidden}.card summary{cursor:pointer;list-style:none;padding:23px}.card summary::-webkit-details-marker{display:none}.card summary h3{margin:13px 0 7px}.card summary p{font-size:13px;color:var(--muted);margin-bottom:0}.tag{font-size:11px;color:var(--brand);background:var(--soft);padding:4px 9px;border-radius:5px;display:inline-block}.tag.warm{color:#805728;background:#f9eedf}.card-body{border-top:1px solid var(--line);padding:22px}.card-body h4{font-size:12px;color:var(--brand);margin:0 0 7px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.formula{font:18px/1.8 Georgia,"Malgun Gothic",serif;background:var(--bg);padding:13px 16px;border-left:3px solid #adbd9f;white-space:pre-wrap;overflow-wrap:anywhere;margin:15px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.actions button{font-size:13px}.empty{padding:45px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:#ffffff70;color:var(--muted);grid-column:1/-1}.qcard{padding:26px;margin-bottom:18px}.qcard h3{margin:16px 0}.choices{display:grid;gap:9px}.choice{text-align:left;display:flex;gap:12px;align-items:start}.choice span{color:var(--muted);min-width:22px}.choice.correct{background:#e5f2e8;border-color:#71a681;color:#205c38}.choice.wrong{background:#fff0ec;border-color:#d69688;color:var(--bad)}.feedback{border-radius:9px;background:var(--soft);padding:17px;margin-top:16px;font-size:14px}.progress{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:12px}.progress i{display:block;background:var(--brand);height:100%}.notice{background:#eeeee5;border-radius:9px;padding:13px 17px;font-size:13px;margin:0 0 22px;color:#5b665b}.note{margin-top:16px}.note label{font-size:12px;display:block;margin-bottom:6px}.note textarea{min-height:85px;font-size:14px}dialog{border:1px solid var(--line);border-radius:16px;width:640px;max-width:calc(100% - 28px);max-height:90vh;padding:28px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#162a2466;backdrop-filter:blur(3px)}dialog label{display:block;font-size:13px;margin:14px 0 5px}dialog input,dialog select{width:100%}dialog textarea{min-height:90px}dialog h2{margin-bottom:8px}.settings{max-width:760px}.settings .card{padding:25px;margin-bottom:18px}.help ol{padding-left:22px}.help li{margin:10px 0}.danger{color:var(--bad)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 22px;border-radius:10px;z-index:50;display:none;max-width:90%;font-size:13px}.check{color:var(--brand);font-size:12px}.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(min-width:1500px){.main{padding:40px 70px}}@media(max-width:1000px){.shell{grid-template-columns:195px 1fr}.main{padding:25px}.sidebar{padding:30px 15px}.hero-art{width:140px;height:140px}.hero{grid-template-columns:1fr 140px}.stat{padding:14px}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.sidebar{position:static;width:100%;height:auto;padding:18px 18px 10px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:22px}.sidebar>.eyebrow,.sidebottom{display:none}.nav{display:flex;overflow-x:auto;margin-top:17px;gap:5px;padding-bottom:6px}.nav button{white-space:nowrap;font-size:13px;padding:9px 12px}.nav b{display:none!important}.main{padding:21px 17px 50px}.topline{margin-bottom:25px;padding-bottom:15px}.hero{display:block}.hero-art{display:none}h1{font-size:31px}.stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}.stat strong{font-size:25px}.sectionhead h2{font-size:21px}.qcard{padding:19px}.card summary{padding:20px}.sectionhead{align-items:start}.sectionhead button{font-size:12px}.toolbar select{flex:1}.hero p{font-size:14px}dialog{padding:21px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">Study<span>folio.</span></div><div class="eyebrow">ECONOMICS · PERSONAL STUDY</div><nav class="nav" aria-label="학습 메뉴" id="nav"></nav><div class="sidebottom">작은 이해가 쌓여,<br>단단한 실력이 됩니다.<br><br>PERSONAL LEARNING SPACE<br>기록은 이 브라우저에 저장됩니다.</div></aside>
<main class="main"><div class="topline"><span id="owner">지환의 경제학 서재</span><span class="muted" id="date"></span></div><div id="app"></div><footer class="footer">Studyfolio · 나만의 속도로, 깊이 있게. <span style="float:right">경제학 예제 콘텐츠 포함</span></footer></main></div>
<dialog id="editor"><form id="editForm"><div class="row"><h2 id="editTitle">학습 자료 추가</h2><button type="button" id="closeEdit" aria-label="닫기">✕</button></div><p class="muted">내용은 저장 후 바로 학습 목록에 반영됩니다.</p><label for="kind">자료 유형</label><select id="kind"><option value="concept">개념 카드</option><option value="quiz">객관식 문제</option><option value="short">약술형 문제</option><option value="essay">논술형 문제</option></select><label for="unit">과목</label><input id="unit" required maxlength="40" placeholder="예: 미시경제학" list="unitList"><datalist id="unitList"></datalist><label for="title">제목 / 질문</label><textarea id="title" required maxlength="3000"></textarea><div id="conceptFields"><label for="hint">한 줄 설명</label><input id="hint" maxlength="300"><label for="formula">핵심 수식 (일반 텍스트)</label><input id="formula" maxlength="1000"></div><div id="quizFields" hidden><label for="options">보기 (한 줄에 하나씩, 2~6개)</label><textarea id="options"></textarea><label for="correct">정답 번호</label><input id="correct" type="number" min="1" max="6" value="1"></div><label for="body" id="bodyLabel">개념 설명</label><textarea id="body" required maxlength="30000"></textarea><div class="actions"><button class="primary" type="submit">자료 저장</button><button type="button" id="cancelEdit">취소</button></div></form></dialog>

<script>
'use strict';
// ===== 기본 학습 자료 =====
// 아래 SEED를 수정하면 처음 방문하는 사용자에게 보이는 자료가 바뀝니다.
// 기존 사용자의 자료는 localStorage에 남습니다. 화면에서도 자료를 추가/수정할 수 있습니다.
const SEED = [
['미시경제학','소비자 선택','예산 제약 아래에서 효용을 극대화하기','MUₓ / MUᵧ = pₓ / pᵧ','미분 가능한 효용함수의 내부 최적점에서는 한계대체율이 상대가격과 일치합니다.\n접점 조건만으로 최적해를 단정하지 말고 선호의 볼록성, 예산 제약, 코너해 가능성을 함께 확인합니다.'],
['미시경제학','슬러츠키 분해','가격 변화의 대체효과와 소득효과','∂xᵢ/∂pⱼ = ∂hᵢ/∂pⱼ − xⱼ · ∂xᵢ/∂m','마셜수요의 가격 효과는 보상수요의 가격 효과와 소득 효과로 나뉩니다.\n자기 가격 상승의 대체효과는 수요를 줄이거나 그대로 두는 방향입니다. 열등재의 소득효과가 충분히 크면 기펜재가 될 수 있습니다.'],
['미시경제학','독점의 가격 결정','한계수입과 한계비용의 비교','MR = MC   |   (P − MC)/P = −1/ε','단일가격 독점기업의 내부 이윤극대화 조건은 MR = MC입니다.\nε는 음수로 정의한 수요의 가격탄력성입니다. 통상적인 조건에서 이윤극대화점은 수요의 탄력적인 구간에 위치합니다.'],
['거시경제학','솔로우 성장모형','자본축적과 정상상태','Δk ≈ s f(k) − (n + g + δ)k','k를 유효노동 1단위당 자본으로 정의하면 정상상태는 실제 투자가 자본 유지에 필요한 투자와 같아지는 점입니다.\n저축률 상승은 정상상태의 소득 수준을 높이지만, 외생적 기술진보율이 일정하면 장기 1인당 성장률을 영구적으로 높이지는 않습니다.'],
['거시경제학','IS–LM 모형','재화시장과 화폐시장의 동시 균형','Y = C(Y − T) + I(r) + G\nM/P = L(Y, r)','단기 고정물가 모형에서 IS는 재화시장 균형, LM은 화폐시장 균형을 나타냅니다.\n통상적인 기울기에서는 정부지출 증가가 산출과 이자율을 높입니다. 이자율 상승이 민간투자를 일부 줄이는 현상을 구축효과라고 합니다.'],
['거시경제학','기대확장 필립스곡선','인플레이션, 기대, 실업의 관계','π = πᵉ − α(u − uⁿ) + v   (α > 0)','기대인플레이션과 공급충격이 주어지면 실업률과 인플레이션 사이에 단기 역의 관계가 나타납니다.\n기대가 실제 인플레이션에 적응하면 장기적으로 이 상충관계를 지속해서 이용하기 어렵습니다.'],
['계량경제학','OLS와 불편성','추정량의 성질은 가정에서 출발한다','β̂ = (XᵀX)⁻¹Xᵀy','선형모형에서 X가 완전열계수이고 E[ε | X] = 0이면 OLS는 조건부 불편성을 갖습니다.\n동분산성은 불편성 자체에 필요한 조건은 아닙니다. 가우스–마르코프 정리의 효율성 및 통상적인 분산 추정에는 추가 조건이 필요합니다.'],
['계량경제학','누락변수 편의','관련 변수를 빼면 어떤 문제가 생길까','plim β̂₁ = β₁ + β₂ · Cov(x₁,x₂)/Var(x₁)','참모형이 y = β₀ + β₁x₁ + β₂x₂ + ε인데 x₂를 누락한 경우입니다.\n다른 통상적 조건 아래 편의의 방향은 누락변수의 효과 β₂와 두 설명변수의 공분산 부호에 의해 결정됩니다.'],
['국제경제학','비교우위','절대 생산성보다 기회비용','비교우위 = 상대적으로 낮은 기회비용','한 나라가 모든 재화에서 절대우위를 가져도 상대적 기회비용이 다르면 교역의 이익이 생길 수 있습니다.\n리카도 모형에서는 기술 차이와 상대적 노동생산성이 비교우위의 원천입니다.'],
['국제경제학','이자율평가','금리 차이와 예상 환율 변화','i − i* ≈ (Eᵉ − E) / E','E를 외화 1단위의 자국통화 가격으로 정의합니다. 위험중립 등 비커버드 이자율평가의 가정 아래 국내 금리가 더 높으면 자국통화의 예상 절하율이 양수입니다.\n환율의 표시 방식과 기대환율의 기준을 먼저 확인해야 합니다.'],
['화폐금융론','피셔 방정식','명목금리와 실질금리의 연결','i ≈ r + πᵉ','낮은 금리와 인플레이션율에서는 명목금리를 실질금리와 기대인플레이션의 합으로 근사합니다.\n사전적 실질금리는 기대인플레이션, 사후적 실질금리는 실현된 인플레이션을 사용합니다.'],
['화폐금융론','채권가격과 금리','미래 현금흐름을 현재가치로 환산하기','P = Σ Cₜ / (1 + y)ᵗ','고정된 양의 현금흐름을 지급하는 채권은 할인율인 시장수익률이 상승하면 가격이 하락합니다.\n다른 조건이 같을 때 듀레이션이 클수록 작은 금리 변화에 대한 가격 민감도가 큽니다.']
].map((a,i)=>({id:'c'+i,type:'concept',unit:a[0],title:a[1],hint:a[2],formula:a[3],body:a[4]}));
const QUIZZES=[
['미시경제학','효용극대화의 내부해에서 성립하는 접점 조건은?',['MRS = pₓ/pᵧ','MRS = 소득','MUₓ = 0','pₓ = pᵧ'],0,'내부 접점에서는 한계대체율과 상대가격이 일치합니다. 코너해에는 그대로 적용할 수 없습니다.'],
['미시경제학','기펜재에 관한 올바른 설명은?',['모든 열등재는 기펜재다','기펜재는 열등재다','대체효과가 양수다','소득효과는 없다'],1,'기펜재에서는 가격 상승의 양의 소득효과가 음의 대체효과를 압도합니다.'],
['미시경제학','단일가격 독점의 내부 이윤극대화 조건은?',['P = 0','AR = 0','MR = MC','MC = 0'],2,'산출량을 한 단위 늘릴 때 한계수입과 한계비용이 같아지는 조건입니다. 최댓값 및 경계 조건도 확인해야 합니다.'],
['거시경제학','표준 솔로우 모형에서 저축률의 영구적 상승은?',['장기 1인당 성장률을 영구히 높인다','정상상태 소득 수준을 높인다','자본축적에 영향을 주지 않는다','기술진보율을 자동으로 높인다'],1,'저축률 상승은 수준 효과와 이행기 성장 효과를 갖지만 장기 1인당 성장률은 외생적 기술진보율에 의해 결정됩니다.'],
['거시경제학','통상적인 IS–LM 모형에서 정부지출 증가의 효과는?',['IS 좌측 이동','LM 좌측 이동','IS 우측 이동','LM 우측 이동'],2,'정부지출 증가는 각 이자율에서 총수요를 높여 IS를 우측으로 이동시킵니다.'],

['계량경제학','완전열계수 조건 아래 OLS 불편성과 직접 관련된 가정은?',['모든 변수가 정규분포','E[ε | X] = 0','표본 수가 반드시 1,000 이상','설명변수의 평균이 0'],1,'조건부 평균이 0이면 E[β̂ | X] = β입니다. 오차 정규성은 불편성의 필수 조건이 아닙니다.'],

['국제경제학','비교우위를 결정하는 것은?',['인구 규모','절대 생산량','상대적 기회비용','통화 단위'],2,'비교우위는 재화를 생산할 때 포기하는 다른 재화의 양을 비교합니다.'],

const WRITTEN=[{id:'s1',type:'short',unit:'미시경제학',title:'대체효과와 소득효과를 구분하고 기펜재의 성립 조건을 설명하시오.',body:'① 대체효과: 효용을 보상한 상태의 상대가격 변화에 대한 수요 반응.\n② 소득효과: 구매력 변화에 따른 수요 반응.\n③ 기펜재: 열등재 중 가격 상승의 양의 소득효과가 음의 대체효과를 압도하는 경우.'},{id:'s2',type:'short',unit:'계량경제학',title:'이분산성이 OLS 추정과 통계적 추론에 미치는 영향을 설명하시오.',body:'조건부 평균 0 등 다른 가정이 유지되면 OLS 불편성은 유지됩니다. 그러나 통상적 가우스–마르코프 효율성은 보장되지 않고, 동분산성을 전제로 한 표준오차는 적절하지 않을 수 있습니다. 이분산성 강건 표준오차 등으로 추론을 조정합니다.'},{id:'e1',type:'essay',unit:'거시경제학',title:'공급충격으로 물가 상승과 경기 둔화가 동시에 발생할 때 통화정책의 상충관계를 논하시오.',body:'답안 구성 예시\n1. 비용 상승 충격이 단기 총공급 또는 필립스곡선에 미치는 영향을 제시합니다.\n2. 긴축정책의 물가 안정 효과와 단기 산출·고용 비용을 비교합니다.\n3. 기대인플레이션의 안정 여부, 충격의 지속성, 정책 신뢰에 따라 대응을 구분합니다.\n4. 중장기 기대 안정과 공급 측 대응을 함께 논의합니다.\n단일 정답이 있는 문항이 아니며, 가정과 인과관계의 일관성을 점검하세요.'},{id:'e2',type:'essay',unit:'국제경제학',title:'변동환율제와 고정환율제에서 통화정책의 효과를 비교하시오.',body:'먼델–플레밍 모형의 소국 개방경제, 단기 고정물가, 완전자본이동 가정을 먼저 제시합니다.\n변동환율제에서는 통화확대가 환율 절하 및 순수출 증가를 통해 산출을 높일 수 있습니다.\n고정환율제에서는 환율 방어를 위한 외환시장 개입이 통화확대 효과를 상쇄합니다.\n자본이동의 불완전성, 위험 프리미엄, 물가 조정이 있을 때 결론이 달라질 수 있음을 덧붙입니다.'}];
const KEY='studyfolio-economics-v1';
const fresh=()=>({version:1,name:'지환의 경제학 서재',items:structuredClone([...SEED,...QUIZZES,...WRITTEN]),done:{},star:{},answers:{},drafts:{},notes:{}});
let state=fresh(),storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);validate(parsed);state=parsed}}catch(e){storageOK=false;setTimeout(()=>toast('저장 기록을 불러오지 못했습니다. 백업 파일을 확인하세요.'),500)}
let mode='concept',unit='전체',query='',filter='all',editing=null;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(s){if(!s||s.version!==1||typeof s.name!=='string'||!Array.isArray(s.items)||s.items.length>5000)throw Error('형식 오류');const ids=new Set();for(const i of s.items){if(!i||typeof i.id!=='string'||ids.has(i.id)||!['concept','quiz','short','essay'].includes(i.type)||!['unit','title','body'].every(k=>typeof i[k]==='string')||['__proto__','constructor','prototype'].includes(i.id))throw Error('자료 오류');ids.add(i.id);if(i.type==='quiz'&&(!Array.isArray(i.options)||i.options.length<2||i.options.length>6||!i.options.every(v=>typeof v==='string')||!Number.isInteger(i.correct)||i.correct<0||i.correct>=i.options.length))throw Error('객관식 형식 오류')}for(const k of ['done','star','answers','drafts','notes'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('기록 오류');for(const [id,a] of Object.entries(s.answers)){const i=s.items.find(x=>x.id===id);if(!i||i.type!=='quiz'||!Number.isInteger(a)||a<0||a>=i.options.length)throw Error('채점 기록 오류')}for(const k of ['drafts','notes'])if(!Object.values(s[k]).every(v=>typeof v==='string'))throw Error('텍스트 기록 오류')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true}catch(e){storageOK=false;toast('브라우저 저장 실패: 백업 내보내기로 기록을 보관하세요.');return false}}
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3500)}
const menus=[['concept','01','개념 서재'],['quiz','02','객관식 연습'],['short','03','약술형 연습'],['essay','04','논술 연습'],['review','05','오답 · 복습'],['settings','⚙','설정 · 백업']];
function setMode(v){mode=v;query='';filter='all';render();window.scrollTo({top:0,behavior:'instant'})}
function header(){const concepts=state.items.filter(i=>i.type==='concept'),qs=state.items.filter(i=>i.type==='quiz'),solved=qs.filter(i=>state.answers[i.id]!==undefined),right=solved.filter(i=>state.answers[i.id]===i.correct),done=concepts.filter(i=>state.done[i.id]).length;return `<section class="hero"><div><div class="eyebrow">YOUR PERSONAL ECONOMICS LAB</div><h1>오늘의 이해가,<br>내일의 실력이 되도록.</h1><p>개념을 연결하고, 문제로 확인하고, 나의 언어로 정리하세요.</p><span class="tag">${esc(state.name)}</span></div><div class="hero-art" aria-hidden="true"></div></section><section class="stats" aria-label="전체 학습 현황"><div class="stat"><small>개념 학습</small><strong>${done} <small>/ ${concepts.length}</small></strong><div class="progress"><i style="width:${concepts.length?done/concepts.length*100:0}%"></i></div></div><div class="stat"><small>풀어본 객관식</small><strong>${solved.length} <small>/ ${qs.length}</small></strong></div><div class="stat"><small>최근 답안 정답률</small><strong>${solved.length?Math.round(right.length/solved.length*100):0}<small> %</small></strong></div><div class="stat"><small>다시 볼 오답</small><strong>${solved.length-right.length}<small> 문항</small></strong></div></section>`}
function render(){document.title=state.name;$('owner').textContent=state.name;$('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('nav').innerHTML=menus.map(([v,n,t])=>`<button data-mode="${v}" class="${mode===v?'active':''}" ${mode===v?'aria-current="page"':''}><b>${n}</b>${t}</button>`).join('');if(mode==='settings'){renderSettings();return}const titles={concept:['개념 서재','핵심을 이해하고, 학습 완료로 기록하세요.'],quiz:['객관식 연습','보기를 선택하면 정답과 해설이 표시됩니다.'],short:['약술형 연습','핵심 개념을 짧고 정확하게 설명해 보세요.'],essay:['논술 연습','가정, 논리, 결론을 연결해 답안을 작성하세요.'],review:['오답 · 복습','틀린 문제와 다시 보고 싶은 자료를 모았습니다.']};const units=[...new Set(state.items.map(i=>i.unit))];if(!units.includes(unit))unit='전체';$('app').innerHTML=header()+`<div class="sectionhead"><div><h2>${titles[mode][0]}</h2><small>${titles[mode][1]}</small></div><button class="primary" data-action="add">＋ 자료 추가</button></div><div class="toolbar"><input id="search" type="search" aria-label="학습 자료 검색" placeholder="제목, 개념, 해설 검색" value="${esc(query)}"><select id="filter" aria-label="자료 필터"><option value="all">${mode==='review'?'오답 + 북마크':'전체 자료'}</option><option value="star">북마크만</option>${mode==='concept'?'<option value="undone">미학습만</option>':mode==='quiz'?'<option value="unanswered">안 푼 문제</option><option value="wrong">틀린 문제</option>':mode==='review'?'<option value="wrong">오답만</option>':''}</select></div><div class="chips" aria-label="과목 필터">${['전체',...units].map(u=>`<button data-unit="${esc(u)}" class="${u===unit?'active':''}" aria-pressed="${u===unit}">${esc(u)}</button>`).join('')}</div><div id="resultCount" class="muted" style="font-size:12px;margin-bottom:12px"></div><div id="list"></div>`;$('filter').value=filter;renderList()}
function matches(i){const wrong=i.type==='quiz'&&state.answers[i.id]!==undefined&&state.answers[i.id]!==i.correct;return (mode==='review'?(wrong||state.star[i.id]):i.type===mode)&&(unit==='전체'||unit===i.unit)&&[i.title,i.body,i.hint,i.formula,...(i.options||[])].join(' ').toLowerCase().includes(query.toLowerCase())&&(filter==='all'||filter==='star'&&state.star[i.id]||filter==='undone'&&!state.done[i.id]||filter==='unanswered'&&state.answers[i.id]===undefined||filter==='wrong'&&wrong)}
function controls(i){return `<div class="actions"><button data-action="star" data-id="${esc(i.id)}" aria-pressed="${!!state.star[i.id]}">${state.star[i.id]?'★ 북마크됨':'☆ 북마크'}</button>${i.type==='concept'?`<button data-action="done" data-id="${esc(i.id)}" aria-pressed="${!!state.done[i.id]}">${state.done[i.id]?'✓ 학습 완료':'학습 완료 표시'}</button>`:''}<button data-action="edit" data-id="${esc(i.id)}">수정</button><button data-action="delete" data-id="${esc(i.id)}" aria-label="${esc(i.title)} 삭제">삭제</button></div>`}
function note(i){return `<div class="note"><label for="note-${esc(i.id)}">나의 메모 · 입력 시 자동 저장</label><textarea id="note-${esc(i.id)}" data-note="${esc(i.id)}" placeholder="헷갈린 이유, 기억할 포인트를 적어보세요.">${esc(state.notes[i.id]||'')}</textarea></div>`}
function concept(i){return `<details class="card"><summary><div class="row"><span class="tag">${esc(i.unit)}</span><span class="check">${state.done[i.id]?'✓ 학습 완료':'개념 펼치기 ＋'}</span></div><h3>${esc(i.title)} ${state.star[i.id]?'☆':''}</h3><p>${esc(i.hint||'클릭하여 개념을 확인하세요.')}</p></summary><div class="card-body"><h4>핵심 이해</h4><div class="text">${esc(i.body)}</div>${i.formula?`<div class="formula">${esc(i.formula)}</div>`:''}${controls(i)}${note(i)}</div></details>`}
function question(i){const a=state.answers[i.id],answered=a!==undefined;return `<article class="card qcard"><span class="tag">${esc(i.unit)}</span> <span class="tag warm">객관식</span><h3>${esc(i.title)}</h3><div class="choices">${i.options.map((o,n)=>`<button class="choice ${answered&&n===i.correct?'correct':answered&&n===a?'wrong':''}" data-action="answer" data-id="${esc(i.id)}" data-index="${n}" ${answered?'disabled':''}><span>${n+1}.</span>${esc(o)} ${answered&&n===i.correct?' ✓ 정답':''}${answered&&n===a&&a!==i.correct?' ✕ 내 선택':''}</button>`).join('')}</div>${answered?`<div class="feedback" role="status"><b>${a===i.correct?'정답입니다.':'다시 확인해 보세요.'}</b><div class="text">${esc(i.body)}</div></div><div class="actions"><button data-action="retry" data-id="${esc(i.id)}">다시 풀기</button></div>`:''}${controls(i)}${answered?note(i):''}</article>`}
function written(i){return `<article class="card qcard"><span class="tag">${esc(i.unit)}</span> <span class="tag warm">${i.type==='short'?'약술형':'논술형'}</span><h3>${esc(i.title)}</h3><label for="draft-${esc(i.id)}" class="muted">나의 답안 · 입력 시 자동 저장</label><textarea id="draft-${esc(i.id)}" data-draft="${esc(i.id)}" placeholder="먼저 스스로 답안을 작성한 뒤, 아래 예시와 비교하세요.">${esc(state.drafts[i.id]||'')}</textarea><small id="count-${esc(i.id)}">${(state.drafts[i.id]||'').length}자</small><details class="feedback"><summary>답안 구성 예시 보기 · 자기 점검</summary><p class="text" style="margin-top:15px">${esc(i.body)}</p><small>자동 채점 기능은 없습니다. 핵심 개념과 논리 전개를 비교하세요.</small></details>${controls(i)}</article>`}
function renderList(){const items=state.items.filter(matches);$('resultCount').textContent=`${items.length}개 자료 · 과목별 필터와 검색을 함께 사용할 수 있어요`;$('list').className=mode==='concept'?'grid':'';$('list').innerHTML=items.length?items.map(i=>i.type==='concept'?concept(i):i.type==='quiz'?question(i):written(i)).join(''):'<div class="empty">표시할 자료가 없습니다.<br>필터를 바꾸거나 새로운 학습 자료를 추가해 보세요.</div>'}
function renderSettings(){$('app').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">MAKE IT YOURS</div><h1 style="margin:10px 0">나의 학습 공간 설정</h1><p class="muted">자료와 기록을 내 방식으로 관리하세요.</p></div></div><div class="settings"><section class="card"><h2>서재 이름</h2><div class="toolbar"><input id="nameInput" aria-label="서재 이름" maxlength="60" value="${esc(state.name)}"><button data-action="rename" class="primary">저장</button></div></section><section class="card"><h2>백업과 복원</h2><p class="muted">자료, 풀이 기록, 답안, 메모를 JSON 파일로 내보냅니다. 다른 기기에서는 백업 파일을 가져와 이어서 공부할 수 있습니다.</p><div class="notice">기록은 현재 브라우저에만 저장됩니다. 자동 기기 동기화는 없으며, 브라우저 데이터 삭제 시 사라질 수 있습니다. 정기적으로 백업하세요.${storageOK?'':' 현재 브라우저 저장을 사용할 수 없습니다.'}</div><div class="actions"><button class="primary" data-action="export">백업 내보내기 ↓</button><button data-action="import">백업 가져오기 ↑</button></div></section><section class="card help"><h2>GitHub Pages에 올리기</h2><ol><li>이 파일을 <b>index.html</b>이라는 이름으로 저장합니다.</li><li>GitHub 저장소의 최상위 폴더에 업로드하고 커밋합니다.</li><li>저장소의 <b>Settings → Pages</b>에서 <b>Deploy from a branch</b>를 선택합니다.</li><li>브랜치를 <b>main</b>, 폴더를 <b>/(root)</b>로 지정하고 저장합니다.</li><li>배포가 완료되면 Pages에 표시된 주소로 접속합니다.</li></ol><p class="muted">화면에서 추가한 자료는 해당 브라우저에만 저장됩니다. 모든 방문자에게 기본 자료로 제공하려면 HTML의 SEED, QUIZZES, WRITTEN 배열을 수정해 다시 업로드하세요. 외부 라이브러리나 API 키는 필요하지 않습니다.</p><p><a href="https://docs.github.com/en/pages/quickstart" target="_blank" rel="noopener noreferrer">GitHub Pages 공식 안내 ↗</a></p></section><section class="card"><h2>학습 기록 초기화</h2><p class="muted">자료와 서재 이름은 유지하고, 학습 완료·북마크·풀이·답안·메모 기록을 지웁니다. 먼저 백업을 권장합니다.</p><button data-action="reset" class="danger">학습 기록 초기화</button></section><p class="muted">기본 콘텐츠는 기능을 체험할 수 있는 경제학 예제입니다. 교재 전체나 시험 기출문제 모음이 아니며, 수식은 일반 텍스트로 표시됩니다.</p></div>`}
function openEditor(id){editing=id||null;const i=state.items.find(x=>x.id===id);$('editForm').reset();$('editTitle').textContent=i?'학습 자료 수정':'학습 자료 추가';$('kind').value=i?.type||(['concept','quiz','short','essay'].includes(mode)?mode:'concept');$('kind').disabled=!!i;$('unit').value=i?.unit||(unit==='전체'?'미시경제학':unit);$('title').value=i?.title||'';$('hint').value=i?.hint||'';$('formula').value=i?.formula||'';$('body').value=i?.body||'';$('options').value=i?.options?.join('\n')||'';$('correct').value=(i?.correct??0)+1;$('unitList').innerHTML=[...new Set(state.items.map(x=>x.unit))].map(u=>`<option value="${esc(u)}">`).join('');toggleFields();$('editor').showModal()}
function toggleFields(){$('conceptFields').hidden=$('kind').value!=='concept';$('quizFields').hidden=$('kind').value!=='quiz';$('bodyLabel').textContent=$('kind').value==='concept'?'개념 설명':$('kind').value==='quiz'?'정답 해설':'답안 구성 예시'}
$('kind').onchange=toggleFields;$('closeEdit').onclick=$('cancelEdit').onclick=()=>$('editor').close();
$('editForm').onsubmit=e=>{e.preventDefault();const type=$('kind').value;const i={id:editing||'u'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),type,unit:$('unit').value.trim(),title:$('title').value.trim(),body:$('body').value.trim()};if(!i.unit||!i.title||!i.body){toast('과목, 제목, 내용을 입력하세요.');return}if(type==='concept'){i.hint=$('hint').value.trim();i.formula=$('formula').value.trim()}if(type==='quiz'){i.options=$('options').value.split('\n').map(x=>x.trim()).filter(Boolean);i.correct=Number($('correct').value)-1;if(i.options.length<2||i.options.length>6||!Number.isInteger(i.correct)||i.correct<0||i.correct>=i.options.length){toast('보기 2~6개와 올바른 정답 번호를 입력하세요.');return}}if(editing){const old=state.items.find(x=>x.id===editing);if(type==='quiz'&&(JSON.stringify(old.options)!==JSON.stringify(i.options)||old.correct!==i.correct||old.title!==i.title))delete state.answers[i.id];state.items=state.items.map(x=>x.id===editing?i:x)}else state.items.push(i);const ok=save();$('editor').close();mode=type;unit=i.unit;query='';filter='all';render();if(ok)toast('학습 자료를 저장했습니다.')};
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){query=el.value;renderList()}if(el.dataset.note){state.notes[el.dataset.note]=el.value;save()}if(el.dataset.draft){state.drafts[el.dataset.draft]=el.value;save();$('count-'+el.dataset.draft).textContent=el.value.length+'자'}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;renderList()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){setMode(b.dataset.mode);return}if(b.dataset.unit){unit=b.dataset.unit;render();return}const id=b.dataset.id,i=state.items.find(x=>x.id===id);switch(b.dataset.action){case'add':openEditor();break;case'edit':openEditor(id);break;case'delete':if(confirm('이 자료와 연결된 기록을 삭제할까요?')){state.items=state.items.filter(x=>x.id!==id);for(const k of ['done','star','answers','drafts','notes'])delete state[k][id];save();render()}break;case'star':case'done':{const k=b.dataset.action;state[k][id]=!state[k][id];save();const opened=[...document.querySelectorAll('details.card[open]')].map(x=>x.querySelector('[data-id]')?.dataset.id);render();for(const d of document.querySelectorAll('details.card'))if(opened.includes(d.querySelector('[data-id]')?.dataset.id))d.open=true;break}case'answer':if(i&&state.answers[id]===undefined){state.answers[id]=Number(b.dataset.index);save();render()}break;case'retry':delete state.answers[id];save();mode='quiz';unit=i.unit;query='';filter='all';render();toast('최근 채점 기록을 지웠습니다. 다시 풀어보세요.');break;case'rename':{const name=$('nameInput').value.trim();if(name){state.name=name;const ok=save();render();if(ok)toast('서재 이름을 저장했습니다.')}break}case'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='studyfolio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'import':$('importFile').click();break;case'reset':if(confirm('학습 기록과 메모를 모두 지울까요? 자료는 유지됩니다.')){for(const k of ['done','star','answers','drafts','notes'])state[k]={};const ok=save();render();if(ok)toast('학습 기록을 초기화했습니다.')}break}});
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('10MB 이하 파일만 가져올 수 있습니다.');const s=JSON.parse(await f.text());validate(s);if(confirm('현재 자료와 기록을 이 백업으로 교체할까요?')){state=s;const ok=save();unit='전체';render();if(ok)toast('백업을 복원했습니다.')}}catch(err){toast('가져오기 실패: 올바른 Studyfolio 백업 파일인지 확인하세요.')}finally{e.target.value=''}};
render();
</script></body></html>
